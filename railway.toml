[build]
builder = "NIXPACKS"

[deploy]
startCommand = "npm run start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

# After first deploy: Railway → Service → Volumes → Add Volume
# Mount path must match DATA_DIR exactly, e.g.:
#   Mount: /data     →  variable DATA_DIR=/data
#   Mount: /app/data →  variable DATA_DIR=/app/data
# Relative values like "data" do NOT use the volume and wipe on every deploy.
